name: Release

# Publishing uses PyPI Trusted Publishing: no password or token is stored anywhere.
# PyPI releases only come from version tags (v0.1.0); TestPyPI can be tried by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish a manual run
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"
  # Supply chain: the build tools (hatchling, twine) were published at least 7 days ago.
  UV_EXCLUDE_NEWER: "7 days"

# One release at a time; a running one is never cancelled halfway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    # Same repository and commit. The classic ./ form rather than the newer $/ one,
    # which some tools (actionlint 1.7) do not read yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    name: Build the distributions
    needs: ci # the release runs the whole test suite on the tagged commit first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false # a release is built from a clean slate, never from a cache
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/caviard/__init__.py)
          echo "tag: $GITHUB_REF_NAME, package: $version"
          test "v$version" = "$GITHUB_REF_NAME"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/caviard
    permissions:
      id-token: write # Trusted Publishing: a short-lived token instead of a stored password
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    # A pushed tag only: a manual run started from a tag publishes to TestPyPI at most.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/caviard
    permissions:
      id-token: write # Trusted Publishing: a short-lived token instead of a stored password
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
