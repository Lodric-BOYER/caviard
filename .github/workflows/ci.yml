name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs it first: nothing is published if it fails

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  # LiteLLM downloads its model price list at import unless told to use its copy.
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  # Supply chain: nothing published in the last 7 days is installed or run here.
  # Compromised releases (LiteLLM 1.82.7, 1.82.8 and 1.107.0) were removed within hours.
  UV_EXCLUDE_NEWER: "7 days"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv venv --python 3.13
      - run: uv pip install -e . --group lint --group integrations
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv venv --python "$PYTHON_VERSION"
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }} # a variable, never pasted into the script
      - run: uv pip install -e . --group test --group integrations
      - run: uv run --no-sync pytest --cov

  security:
    name: Dependencies and code scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Resolve what a new install gets
        # The latest releases, every extra included, read from pyproject.toml: nothing is
        # built, installed or run.
        run: |
          uv pip compile pyproject.toml --no-build --quiet --python-version 3.13 \
            --extra otel --extra langfuse --extra litellm --extra yaml -o audit.txt
        env:
          UV_EXCLUDE_NEWER: "0 days"
      - name: Known vulnerabilities in what users install
        # pip-audit checks the resolved versions without installing them; the script
        # turns each advisory into an error.
        run: |
          uvx pip-audit -r audit.txt --no-deps --disable-pip \
            --progress-spinner off --format json --output audit.json || true
          python3 scripts/audit_dependencies.py audit.json
      - name: Static analysis
        run: uvx bandit -q -r src

  build:
    name: Build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/clean --python 3.13
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/caviard --version
          /tmp/clean/bin/caviard scan --check "rien à signaler"
          /tmp/clean/bin/python -c "import caviard; assert caviard.redact('jean@exemple.fr').startswith('[EMAIL')"
